<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Soy Kevin Hernández, desarrollador Full Stack en Barcelona. Explora mis proyectos, su ingeniería y mi experiencia con Python, Django, Vue y TypeScript."
    />
    <meta name="theme-color" content="#faf7f0" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("portfolio-theme"); } catch { /* Storage may be blocked. */ }
        const theme = saved === "light" || saved === "dark" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#17191f" : "#faf7f0";
      })();
    </script>
    <title>Kevin Hernández — Full-stack developer</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Onest:wght@400;450;500;550;600;650;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
